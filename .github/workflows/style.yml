name: Code Style

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'pretix_roomsharing/locale/**'
      - 'pretix_roomsharing/static/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'pretix_roomsharing/locale/**'
      - 'pretix_roomsharing/static/**'

permissions:
  contents: read

jobs:
  style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install pretix isort flake8 black docformatter -e .
      # Every check runs even if an earlier one fails, so one CI run reports all problems.
      - name: Run docformatter
        run: docformatter --check -r .
      - name: Run isort
        if: ${{ !cancelled() }}
        run: isort -c .
      - name: Run black
        if: ${{ !cancelled() }}
        run: black --check .
      - name: Run flake8
        if: ${{ !cancelled() }}
        run: flake8 .

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Install dependencies
        run: pip install build twine check-manifest pretix-plugin-build
      - name: Run check-manifest
        run: check-manifest .
      - name: Build package
        run: python -m build
      - name: Check package
        run: twine check dist/*
